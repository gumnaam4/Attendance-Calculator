<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#00ffcc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Attendance Calc">
    <meta name="application-name" content="Attendance Calculator">
    <meta name="description" content="Calculate your attendance percentage and track how many classes you need to attend or can skip.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23121212' width='192' height='192'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='100' fill='%2300ffcc' font-weight='bold' font-family='Arial'>%</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231e1e1e' rx='40' width='180' height='180'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='90' fill='%2300ffcc' font-weight='bold' font-family='Arial'>%</text></svg>">
    <title>Attendance Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            color: #00ffcc;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 8px 24px rgba(0, 255, 204, 0.1);
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            margin-top: 5px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #00ffcc;
            color: #121212;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #00e6b8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background-color: #444;
            color: #fff;
        }

        button.secondary:hover {
            background-color: #555;
        }

        .result {
            margin-top: 20px;
            font-size: 1rem;
            font-weight: bold;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .result-percentage {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .result-key {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .result.low {
            background: rgba(255, 67, 67, 0.1);
            border: 1px solid rgba(255, 67, 67, 0.3);
            color: #ff6b6b;
        }

        .result.medium {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: #ffc107;
        }

        .result.high {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .progress-container {
            margin-top: 15px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffc107, #4caf50);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .history-section {
            margin-top: 25px;
            background-color: rgba(0, 255, 204, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 204, 0.1);
            display: none;
        }

        .history-section.show {
            display: block;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .history-title {
            font-weight: bold;
            color: #00ffcc;
            flex: 1;
            min-width: 0;
        }

        .clear-history-btn {
            padding: 8px 14px;
            font-size: 0.75rem;
            background-color: rgba(255, 67, 67, 0.2);
            border: 1px solid rgba(255, 67, 67, 0.4);
            color: #ff6b6b;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .clear-history-btn:hover {
            background-color: rgba(255, 67, 67, 0.3);
            border-color: rgba(255, 67, 67, 0.6);
        }

        .history-item {
            background-color: #2a2a2a;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item small {
            opacity: 0.7;
            font-size: 0.8rem;
        }

        .branding {
            margin-top: 30px;
            font-size: 0.9rem;
            opacity: 0.6;
            text-align: center;
        }
        
        a {
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 90vw;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    
    </style>
</head>
<body>

    <h1>Attendance Calculator</h1>
    <div class="container">
        <label>Total Hours Held:</label>
        <input type="number" id="totalClasses" placeholder="Enter total hours" min="0">

        <label>Hours Attended:</label>
        <input type="number" id="attendedClasses" placeholder="Enter attended hours" min="0">

        <label>Minimum Attendance %:</label>
        <input type="number" id="criteria" placeholder="Enter minimum percentage" min="0" max="100" value="75">

        <div class="button-group">
            <button onclick="calculateAttendance()">Calculate</button>
            <button class="secondary" onclick="resetForm()">Reset</button>
        </div>

        <div class="result" id="result">Enter your attendance details to get started!</div>

        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-label">
                <span>Attendance Progress</span>
                <span id="percentageText">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="history-section" id="historySection">
            <div class="history-header">
                <div class="history-title">📋 Recent Calculations</div>
                <button class="clear-history-btn" onclick="clearHistory()">Clear</button>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <div class="branding">| Made by <strong><a href="https://www.instagram.com/gumnaam.41/" style="color: white;">Gumnaam</a></strong> | </div>

    <script>
        const MAX_HISTORY = 5;
        
        // Load history from localStorage on page load
        window.addEventListener('DOMContentLoaded', function() {
            loadHistory();
            // Add Enter key support
            document.getElementById('totalClasses').addEventListener('keypress', handleEnter);
            document.getElementById('attendedClasses').addEventListener('keypress', handleEnter);
            document.getElementById('criteria').addEventListener('keypress', handleEnter);
        });

        function handleEnter(event) {
            if (event.key === 'Enter') {
                calculateAttendance();
            }
        }

        function calculateAttendance() {
            const total = parseFloat(document.getElementById('totalClasses').value);
            const attended = parseFloat(document.getElementById('attendedClasses').value);
            const criteria = parseFloat(document.getElementById('criteria').value) || 75;
            const resultDiv = document.getElementById('result');
            const progressContainer = document.getElementById('progressContainer');

            if (isNaN(total) || isNaN(attended) || total <= 0 || attended < 0 || attended > total) {
                resultDiv.innerHTML = "⚠ Please enter valid numbers (attended ≤ total).";
                resultDiv.className = 'result low';
                progressContainer.style.display = 'none';
                return;
            }

            if (criteria < 0 || criteria > 100) {
                resultDiv.innerHTML = "⚠ Attendance criteria must be between 0 and 100%.";
                resultDiv.className = 'result low';
                progressContainer.style.display = 'none';
                return;
            }

            const percentage = (attended / total) * 100;
            let statusClass = percentage < criteria ? 'low' : percentage < 85 ? 'medium' : 'high';
            let keyNumber, keyText, icon;

            if (percentage < criteria) {
                const needed = Math.ceil((criteria * total - 100 * attended) / (100 - criteria));
                keyNumber = needed;
                keyText = `more hour(s) to reach ${criteria}%`;
                icon = '❌';
            } else {
                const canSkip = Math.floor((attended * 100 - criteria * total) / criteria);
                keyNumber = canSkip;
                keyText = `hour(s) can be skipped`;
                icon = '✅';
            }

            const message = `
                <div class="result-percentage">Attendance: <strong>${percentage.toFixed(2)}%</strong></div>
                <div class="result-key">${icon} ${keyNumber}</div>
                <div class="result-percentage">${keyText}</div>
            `;

            resultDiv.innerHTML = message;
            resultDiv.className = 'result ' + statusClass;

            // Update progress bar
            const progressFill = document.getElementById('progressFill');
            const percentageText = document.getElementById('percentageText');
            progressFill.style.width = Math.min(percentage, 100) + '%';
            percentageText.textContent = percentage.toFixed(1) + '%';
            progressContainer.style.display = 'block';

            // Save to history
            saveToHistory({
                total: total,
                attended: attended,
                percentage: percentage.toFixed(2),
                criteria: criteria,
                timestamp: new Date().toLocaleString()
            });
        }

        function saveToHistory(entry) {
            let history = JSON.parse(localStorage.getItem('attendanceHistory') || '[]');
            history.unshift(entry);
            history = history.slice(0, MAX_HISTORY);
            localStorage.setItem('attendanceHistory', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('attendanceHistory') || '[]');
            const historyList = document.getElementById('historyList');
            const historySection = document.getElementById('historySection');

            if (history.length === 0) {
                historySection.classList.remove('show');
                return;
            }

            historyList.innerHTML = history.map(entry => `
                <div class="history-item">
                    <div>
                        <strong>${entry.attended}/${entry.total} hrs (${entry.percentage}%)</strong>
                        <small>${entry.criteria}% criteria</small>
                    </div>
                    <small>${entry.timestamp}</small>
                </div>
            `).join('');

            historySection.classList.add('show');
        }

        function resetForm() {
            document.getElementById('totalClasses').value = '';
            document.getElementById('attendedClasses').value = '';
            document.getElementById('criteria').value = '75';
            document.getElementById('result').innerHTML = 'Enter your attendance details to get started!';
            document.getElementById('result').className = 'result';
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('totalClasses').focus();
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear all calculation history?')) {
                localStorage.removeItem('attendanceHistory');
                loadHistory();
            }
        }

        // Register service worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => {
                    console.log('Service Worker registration failed:', err);
                });
            });
        }
    </script>

</body>
</html>
